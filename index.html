<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2E6B45">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jardim-app">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <title>Jardim-app</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="tb-title">
        <h1 id="page-title">Calendário</h1>
        <span class="tb-ver">Jardim-app <span id="app-version"></span></span>
      </div>
      <button type="button" class="icon-btn" id="backup-btn" title="Fazer backup" aria-label="Fazer backup"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 18.5a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.4 1.7A3.7 3.7 0 0 1 17.5 18.5"/><path d="M12 11v8M9 14l3-3 3 3"/></svg></span></button>
    </header>
    <div id="session-bar" class="session-bar" hidden></div>
    <main id="main" class="main"></main>
    <nav class="bottom-nav" aria-label="Navegação principal">
      <button type="button" data-route="home"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V10l8-6 8 6v10"/><path d="M4 20h16M9 20v-5h6v5"/></svg></span><span>Painel</span></button>
      <button type="button" data-route="calendar"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span><span>Calendário</span></button>
      <button type="button" data-route="jobs"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg></span><span>Trabalhos</span></button>
      <button type="button" data-route="clients"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5M16 5a3.3 3.3 0 0 1 0 6.5M18 14.5c2 .7 3.2 2.5 3.5 5.5"/></svg></span><span>Clientes</span></button>
      <button type="button" data-route="more"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg></span><span>Mais</span></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="picker-root"></div>
  <div id="doc-root" hidden></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript><p style="padding:20px">O Jardim-app precisa de JavaScript ativo.</p></noscript>
  <script src="./app.js"></script>
</body>
</html>
